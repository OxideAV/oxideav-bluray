[package]
name = "oxideav-bluray"
version = "0.0.2"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Mark Karpeles <admin@echelle.co.jp>"]
description = "Read-only Blu-ray Disc (BD-ROM) UDF mount + BDMV directory walk + playlist (.mpls / .clpi) parsing + .m2ts streaming — clean-room per BDA whitepapers + ECMA-167"
repository = "https://github.com/OxideAV/oxideav-bluray"
homepage = "https://github.com/OxideAV/oxideav-bluray"
readme = "README.md"
keywords = ["bluray", "bdmv", "udf", "m2ts", "mpls"]
categories = ["multimedia", "filesystem", "parser-implementations"]

[features]
default = ["registry", "aacs", "aacs-online"]

# `registry` wires up the `bluray://` source driver against
# `oxideav-core::SourceRegistry` so this crate plugs into the broader
# oxideav framework. Drop it (`default-features = false`) for a
# free-standing build that only exposes the UDF mounter + BDMV parsers
# + `Disc` / `TitleSource` API without the framework dependency tree.
registry = ["dep:oxideav-core"]

# `aacs` enables transparent AACS decryption — the `bluray://` source
# driver detects an `AACS/` directory on the disc, loads
# `oxideav_aacs::KeyDb` from the per-platform default location, and
# constructs an AacsDecryptor that handles AES-128-CBC content
# scrambling per AACS Common 0.953 + BD-Prerecorded 0.953. Almost
# every commercial Blu-ray Disc is AACS-encrypted, so this is
# default-on. Turn it off for BD-R / homemade-disc-only consumers
# that want a smaller dep tree.
aacs = ["dep:oxideav-aacs", "dep:thiserror", "dep:libloading"]

# `aacs-online` extends the AACS resolver with two further fallbacks
# after the KEYDB.cfg `<disc_id>=V<vuk>` lookup misses:
#
#   (1) a local on-disk VUK cache at `~/.cache/oxideav/vuk-cache.cfg`
#       (same `<disc_id>=V<vuk>` line format as KEYDB.cfg, so
#        operators can `cat` it back into KEYDB.cfg without
#        reformatting);
#   (2) an *online* VUK derivation against the disc's optical drive —
#       reads the AACS Volume Identifier via MMC `READ DISC STRUCTURE`
#       and walks the disc's MKB Subset-Difference tree with each
#       Device Key parsed from KEYDB.cfg's extended `| DK |` records
#       (`oxideav_aacs::AacsVolume::derive_vuk_from_device_key`).
#
# A successful (2) writes the resolved VUK back to the cache with an
# `online-<RFC3339>` provenance tag so subsequent mounts skip the
# drive query. Gating this behind a feature lets headless / docker /
# CI builds that have no optical drive opt out cleanly with
# `--no-default-features --features registry,aacs`.
aacs-online = ["aacs"]

[dependencies]
# Optional under the `registry` feature so consumers can depend on
# `oxideav-bluray` with `default-features = false` and avoid the
# framework dependency tree entirely.
oxideav-core = { version = "0.1", optional = true }
# Optional under the `aacs` feature. Provides the AES-128-CBC content
# scrambling + KEYDB.cfg parser + MKB / Unit_Key_RO.inf parsers the
# source driver needs to decrypt commercial BD-ROM content.
oxideav-aacs = { version = "0.1", optional = true }
# Optional under the `aacs` feature; powers the per-platform optical-
# drive query for the AACS Volume Identifier in `drive::macos` /
# `drive::linux` / `drive::windows`.
thiserror = { version = "2", optional = true }
# IOKit / CoreFoundation are loaded at runtime via libloading on
# macOS (matches oxideplay's SDL2 loader pattern). Linux + Windows
# backends will use the same crate for SG_IO ioctl handles / SPTI
# DeviceIoControl.
libloading = { version = "0.8", optional = true }
